# ============================================================================
# SmartP 前端 nginx：静态页面 + /api 反代到后端容器
# 构建时 COPY 到容器的 /etc/nginx/conf.d/default.conf
# ============================================================================

# 上游：后端容器（用容器名当域名，两个容器必须在同一个 docker 网络上）
upstream smartp_backend {
    server smartp-backend:9900;
    keepalive 32;          # 与上游保持长连接，SSE 更稳
}

server {
    listen 80;
    server_name _;         # 没域名就用 _；有域名改成 smartp.example.com

    access_log /var/log/nginx/smartp.access.log;
    error_log  /var/log/nginx/smartp.error.log warn;

    # 后端限制单文件 10MB，这里给足余量（否则上传会 413）
    client_max_body_size 20m;

    # 静态资源压缩
    gzip on;
    gzip_comp_level 4;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/xml;

    root /usr/share/nginx/html;
    index index.html;

    # ---------- 静态页面 ----------
    # index.html / styles.css / app.js 文件名固定不变，浏览器会用启发式缓存把它们存下来，
    # 导致「新 HTML + 旧 CSS/JS」的错乱渲染。统一声明不缓存。
    # （原来这段逻辑在后端 app/main.py 的 no_store_frontend_assets 中间件里）
    location = / {
        add_header Cache-Control "no-store, must-revalidate";
        add_header Pragma "no-cache";
    }

    # 页面里是按 /static/app.js、/static/styles.css 引用的绝对路径，
    # 这里把 /static/ 映射到 html 根目录下的同名文件
    location /static/ {
        alias /usr/share/nginx/html/;
        add_header Cache-Control "no-store, must-revalidate";
        add_header Pragma "no-cache";
    }

    # ---------- 后端接口 ----------
    location /api/ {
        proxy_pass http://smartp_backend;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";    # 配合 upstream keepalive

        # ------------------------------------------------------------------
        # 🔴 SSE（流式回答 / AIOps 诊断 / 钉钉推送订阅）必需的几行
        #    /api/chat_stream、/api/aiops、/api/notify/stream 都是长连接流式接口
        #    一旦被 nginx 缓冲，前端就会「一直转圈，最后一次性吐出来」
        # ------------------------------------------------------------------
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;    # 长连接别被 60s 默认值掐断
        proxy_send_timeout 3600s;
    }

    # ---------- 健康检查 / 接口文档（排查用，可留可删）----------
    location = /health {
        proxy_pass http://smartp_backend/health;
        proxy_set_header Host $host;
        access_log off;
    }

    location /docs {
        proxy_pass http://smartp_backend/docs;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://smartp_backend/openapi.json;
        proxy_set_header Host $host;
    }
}